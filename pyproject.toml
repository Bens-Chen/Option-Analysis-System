[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "option-analysis-system"
version = "0.2.0"
description = "Option pricing learning code plus the optcore production core for options and Taiwan warrants."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "scipy>=1.11,<2",
    "openpyxl>=3.1,<4",
    "pyarrow>=14",
]

[project.optional-dependencies]
app = [
    "matplotlib>=3.8,<4",
    "yfinance>=0.2.40,<2",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["optcore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
